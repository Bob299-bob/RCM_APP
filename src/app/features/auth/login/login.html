
<div class="login-container">
  <div class="login-card">

    <h1>Healthcare RCM</h1>
    <p>Sign in to your account</p>

    <form (ngSubmit)="login()">

      <!-- Email -->
      <label>Email Address</label>

      <input
        type="email"
        name="email"
        placeholder="Enter your email"
        [(ngModel)]="email"
        class="form-control"
      />

      <div class="text-danger small mt-1" *ngIf="errors['email']">
        {{ errors['email'] }}
      </div>

      <!-- Password -->
      <label>Password</label>

      <input
        type="password"
        name="password"
        placeholder="Enter your password"
        [(ngModel)]="password"
        class="form-control"
      />

      <div class="text-danger small mt-1" *ngIf="errors['password']">
        {{ errors['password'] }}
      </div>

      <!-- Login Button -->
      <button type="submit">
        Login
      </button>

      <!-- Success Message -->
      <div *ngIf="message" class="alert alert-success mt-3">
        {{ message }}
      </div>

    </form>

  </div>
</div>
